            top: 4px;

        }

            color: var(--bs-cyan);
        }

        .rating-epic {
            color: var(--bs-blue);
        }

        .rating-legendary {
            color: var(--bs-purple);
        }

        .rating-text {
            color: var(--bs-light);
        }

        :is(.rating-low, .rating-mid-low) .rating-text {
            color: var(--bs-black);
        }
