    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            font-family: "Source Sans Pro", sans-serif;
        }

        :root {
            --bs-purple-800: #2c1a4d;
        }

        article::before {
            margin-left: -12px;
            margin-right: -12px;
            background: url("data:image/jpg;base64,") no-repeat center center fixed;
            content: '';
            z-index: -1;
            width: 100%;
            height: 100%;
            position: absolute;
            -webkit-background-size: cover;
            /*-webkit-filter: blur(100px);*/
            opacity: 0.2;
        }

        .bg-purple-800 {
            background-color: var(--bs-purple-800);
        }

        .icon-overlay {
            position: relative;
            display: inline-block;
            top: 4px;
        }

        .icon-overlay .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 3px));
            font-weight: bold;
        }

        .rating-low {
            color: var(--bs-pink);
        }

        .rating-mid-low {
            color: var(--bs-red);
        }

        .rating-mid {
            color: var(--bs-teal);
        }

        .rating-mid-high {
            color: var(--bs-green);
        }

        .rating-high {
            color: var(--bs-blue);
        }

        .rating-epic {
            color: var(--bs-indigo);
        }

        .rating-legendary {
            color: var(--bs-purple);
        }

        .rating-text {
            color: var(--bs-white);
        }

        :is(.rating-low, .rating-mid-low) .rating-text {
            color: var(--bs-black);
        }

    </style>
</head>
