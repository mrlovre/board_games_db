        .navbar {
            background: linear-gradient(to bottom, var(--bs-purple-300) 0%, var(--bs-purple-800) 100%);
        }

        .stats-box {
            background-color: rgba(52, 58, 64, 0.5);
            border-radius: 4px;
            box-shadow: 0px 0px 8px black;
            padding: 0px 8px;
            text-align: center;
        }

        .bg-purple-800 {
            background-color: var(--bs-purple-800);
        }

        .bs-green {
            color: var(--bs-green);
        }

        .bs-yellow {
            color: var(--bs-yellow);
        }

        .bs-blue {
            color: var(--bs-blue);
        }

        .bs-cyan {
            color: var(--bs-cyan);
        }

        .bs-orange {
            color: var(--bs-orange);
        }

        .bs-tertiary-color {
            color: var(--bs-tertiary-color);
        }

        .icon-overlay {
            position: relative;
            display: inline-block;
            top: 4px;
        }

        .icon-overlay .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 3px));
            font-weight: bold;
        }

        .rating-low {
            color: var(--bs-gray);
        }

        .rating-mid-low {
            color: var(--bs-light);
        }

        .rating-mid {
            color: var(--bs-teal);
        }

        .rating-mid-high {
            color: var(--bs-green);
        }

        .rating-high {
            color: var(--bs-cyan);
        }

        .rating-epic {
            color: var(--bs-blue);
        }

        .rating-legendary {
            color: var(--bs-purple);
        }

        .rating-text {
            color: var(--bs-light);
        }

        :is(.rating-low, .rating-mid-low) .rating-text {
            color: var(--bs-black);
        }

    </style>
</head>
