<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Board Games Database</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            font-family: "Source Sans Pro", sans-serif;
        }

        :root {
            --bs-purple-800: #2c1a4d;
        }

        article::before {
            margin-left: -12px;
            margin-right: -12px;
            background: url("data:image/jpg;base64,") no-repeat center center fixed;
            content: '';
            z-index: -1;
            width: 100%;
            height: 100%;
            position: absolute;
            -webkit-background-size: cover;
            /*-webkit-filter: blur(100px);*/
            opacity: 0.2;
        }

        .bg-purple-800 {
            background-color: var(--bs-purple-800);
        }

        .icon-overlay {
            position: relative;
            display: inline-block;
            top: 4px;
        }

        .icon-overlay .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 3px));
            font-weight: bold;
        }

        .rating-low {
            color: var(--bs-pink);
        }

        .rating-mid-low {
            color: var(--bs-red);
        }

        .rating-mid {
            color: var(--bs-teal);
        }

        .rating-mid-high {
            color: var(--bs-green);
        }

        .rating-high {
            color: var(--bs-blue);
        }

        .rating-epic {
            color: var(--bs-indigo);
        }

        .rating-legendary {
            color: var(--bs-purple);
        }

        .rating-text {
            color: var(--bs-white);
        }

        :is(.rating-low, .rating-mid-low) .rating-text {
            color: var(--bs-black);
        }

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-purple-800">
    <div class="container-fluid justify-content-center">
        <a class="navbar-brand fs-1" href="#" style="font-variant: small-caps;">
            <i class="bi bi-dice-4-fill pe-1"></i>
            <b>Game Night</b>
            <i class="bi bi-dice-3-fill ps-1"></i>
        </a>
    </div>
</nav>
<article class="container-fluid">
    <div class="row pt-2">
        <div class="col-3 justify-content-center">
            <img class="img-fluid rounded" src="data:/image/jpg;base64," alt="">
        </div>
        <div class="col-9">
            <div class="row align-items-center justify-content-between">
                <h1 class="col fw-bold mb-0" style="/*font-size: 48px;*/">Shadows: Amsterdam</h1>
            </div>
            <div class="row">
                <div class="col text-secondary">
                    
                    
                </div>

                <ul class="col-auto mb-2 list-inline text-secondary">
                    
                    
                        <li class="list-inline-item me-1">2018</li>
                        <li class="list-inline-item me-1">&bull;</li>
                    

                    
                    

                    
                    
                </ul>
            </div>

            
            
                
            
            <h5 class="fw-semibold" style="min-height: 48px;">Two detective teams race to solve a crime, while trying to avoid police attention.</h5>


            <div class="row align-items-center">
                <div class="col" style="font-size: 72px;">
                    
                    

                    
                    
                    
                    
                    
                    

                    <div class="icon-overlay rating-mid">

                        <i class="bi bi-hexagon-fill"></i>
                        <div class="overlay-text fs-1 rating-text">6.6</div>
                    </div>
                </div>

                

                
                

                
                <div class="col fs-1" style="margin-top: -3.5px;">
                    
                        <i class="bi bi-person-fill" style="margin-right: -10px;"></i>
                    
                        <i class="bi bi-person-fill" style="margin-right: -10px;"></i>
                    
                    
                        <span class="text-secondary"
                              style="position: relative; top: -3px; margin-right: -10px;">(</span>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                            <i class="bi bi-person-fill text-secondary" style="margin-right: -10px;"></i>
                        
                        <span class="text-secondary" style="position: relative; margin-left:1px; top: -3px;">)</span>
                    
                </div>
            </div>

            <div class="row" style="font-size: 48px;">
                <div class="col">
                    
                    <i class="bi bi-clock-fill" style="margin-right: -4px;"></i>
                    
                        <i class="bi bi-clock-fill text-secondary" style="margin-right: -4px;"></i>
                    
                    
                        <i class="bi bi-clock-fill text-secondary" style="margin-right: -4px;"></i>
                    
                </div>

                <div class="col">
                    
                    
                    
                        <i class="bi bi-puzzle-fill" style="margin-right: -5px;"></i>
                    
                    
                        <i class="bi bi-puzzle-fill text-secondary" style="margin-right: -5px;"></i>
                    
                        <i class="bi bi-puzzle-fill text-secondary" style="margin-right: -5px;"></i>
                    
                        <i class="bi bi-puzzle-fill text-secondary" style="margin-right: -5px;"></i>
                    
                        <i class="bi bi-puzzle-fill text-secondary" style="margin-right: -5px;"></i>
                    
                </div>
            </div>

        </div>
    </div>
</article>
</body>
</html>
