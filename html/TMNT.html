            color: var(--bs-yellow);
        }

            color: var(--bs-blue);
        }

        .icon-overlay {
            position: relative;
            display: inline-block;
            top: 4px;
        }

        .icon-overlay .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 3px));
            font-weight: bold;
        }

        .rating-low {
            color: var(--bs-gray);
        }

        .rating-mid-low {
            color: var(--bs-white);
        }

        .rating-mid {
            color: var(--bs-teal);
        }

        .rating-mid-high {
            color: var(--bs-green);
        }

        .rating-high {
            color: var(--bs-cyan);
        }

        .rating-epic {
            color: var(--bs-blue);
        }

        .rating-legendary {
            color: var(--bs-purple);
        }

        .rating-text {
            color: var(--bs-white);
        }

        :is(.rating-low, .rating-mid-low) .rating-text {
            color: var(--bs-black);
        }
