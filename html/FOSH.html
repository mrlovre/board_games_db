    <title>Forest Shuffle — Game Night</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --accent: #0d6efd;
            --contrast: #ffffff;
            --text: #eef1f4;
            --muted: #b5bec8;
            --blue: #66a8ff;
            --cyan: #36d8f4;
            --green: #3bc88b;
            --yellow: #ffd24a;
            --orange: #ffa34e;
        }
        body {
            margin: 0;
            width: 768px;
            height: 620px;
            font-family: "Source Sans Pro", "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: #20272d;
        }
        svg { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
        .game-title {
            height: 96px;
            display: flex;
            align-items: center;
            padding: 14px 24px;
            background: var(--accent);
            color: var(--contrast);
        }
        h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 750;
            line-height: 1.12;
            letter-spacing: -0.6px;
            text-wrap: balance;
        }
        .card-body {
            position: relative;
            isolation: isolate;
            height: 524px;
            padding: 22px 20px;
            display: grid;
            grid-template-columns: 168px minmax(0, 1fr);
            gap: 24px;
            background: color-mix(in srgb, var(--accent) 7%, #20272d);
        }

            opacity: 0.13;
        }
        .cover-column { display: flex; flex-direction: column; min-height: 0; }
        .cover {
            display: block;
            width: 100%;
            max-height: 375px;
            object-fit: contain;
            object-position: top;
            border-radius: 5px;
        }
        .game-night {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }
        .game-night svg { font-size: 25px; }
        .game-night span {
            font-size: 20px;
            font-weight: 800;
            font-variant: small-caps;
            line-height: 1.05;
            text-align: center;
            letter-spacing: 0.8px;
        }
        .details {
            min-width: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) 100px 188px;
            gap: 16px;
        }
        .genres { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .genre {
            border: 1px solid #8c99a5;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 13px;
            line-height: 1.3;
        }
        .credits { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
        .credits span + span::before { content: ' · '; padding: 0 3px; }
        .description { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; }
        .panel {
            background: rgba(25, 31, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
        }
        .rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .rating-label { font-size: 24px; font-weight: 750; font-variant: small-caps; }
        .rating-badge { position: relative; color: var(--accent); width: 76px; height: 82px; }
        .rating-badge svg { width: 100%; height: 100%; }
        .rating-value {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 30px;
            font-weight: 800;
            color: var(--contrast);
        }
        .rating-tier { color: var(--accent); font-size: 25px; font-weight: 750; font-variant: small-caps; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .metric { padding: 10px 12px; min-width: 0; }
        .metric h2 {
            margin: 0 0 8px;
            font-size: 12px;
            line-height: 1;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .metric-content { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .icons { display: flex; align-items: center; gap: 3px; font-size: 25px; }
        .icons .inactive { color: #55616d; }
        .metric-value { font-size: 18px; font-weight: 700; white-space: nowrap; }
        .metric-value small { font-size: 11px; font-weight: 500; }
        .players { color: var(--blue); }
        .players .additional { color: var(--cyan); }
        .players .icons { gap: 0; font-size: 25px; }
        .time { color: var(--yellow); }
        .weight { color: var(--green); }
        .popularity { color: var(--orange); }
        .weight .icons, .popularity .icons { font-size: 24px; }
    </style>
</head>
